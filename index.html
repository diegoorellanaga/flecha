<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8cc8f5">
<title>Resiste a los ragdolls</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #8cc8f5; }
  #c { width: 100%; height: 100%; display: block; touch-action: none; outline: none;
       cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><circle cx='16' cy='16' r='11' fill='none' stroke='black' stroke-width='4' opacity='0.5'/><circle cx='16' cy='16' r='11' fill='none' stroke='white' stroke-width='2'/><circle cx='16' cy='16' r='2.5' fill='red' stroke='white' stroke-width='1'/></svg>") 16 16, crosshair; }
  .hud { position: absolute; color: #dfe6ee; font: 15px system-ui, sans-serif;
         background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 8px; }
  #info { top: calc(10px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px; width: fit-content; max-width: 90%; }
  #info b { color: #ffd166; font-size: 18px; }
  #panel { left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
           display: flex; flex-direction: column; gap: 6px; }
  #fuerza { width: 220px; max-width: 70vw; }
  #viento { top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px));
            text-align: center; border: 2px solid #4af; min-width: 78px; }
  #vFlecha { font-size: 34px; line-height: 40px; color: #fff; transition: transform .3s, opacity .3s;
             display: inline-block; }
  #vBarras { letter-spacing: 1px; color: #ffd166; }
  #sonido { top: calc(150px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px));
            font-size: 20px; border: 0; cursor: pointer; touch-action: manipulation; }
  #aviso { top: calc(60px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
           display: none; font-size: 17px; border: 2px solid #ffd166; max-width: 80vw; text-align: center; }
  #aviso b { color: #ffd166; }
  #poderes { position: absolute; left: 12px; top: calc(56px + env(safe-area-inset-top, 0px));
             display: none; flex-direction: column; gap: 4px; pointer-events: none; }
  #poderes .chip { background: rgba(0,0,0,.55); color: #fff; font: 14px system-ui, sans-serif;
                   padding: 4px 10px; border-radius: 14px; border: 1px solid #ffd166; }
  #poderes .chip b { color: #ffd166; }
  #poderes .chip small { margin-left: 6px; opacity: .75; }
  #poderes .chip.titan { border-color: #ffcc22; box-shadow: 0 0 8px #ffcc22; }
  #jefe { display: none; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
          font-size: 18px; border: 2px solid #c22; }
  #mira { position: absolute; display: none; pointer-events: none; width: 70px; height: 70px;
          border: 3px solid #aaa; border-radius: 50%; transform: translate(-50%, -50%);
          box-shadow: 0 0 0 2px rgba(0,0,0,.4); }
  #modo { display: none; right: calc(12px + env(safe-area-inset-right, 0px));
          bottom: calc(12px + env(safe-area-inset-bottom, 0px)); border: 2px solid #4af;
          font: 600 16px system-ui, sans-serif; padding: 12px 16px; cursor: pointer; touch-action: manipulation; }
  #modo.activo { border-color: #ffd166; color: #ffd166; }
  .tactil { display: none; }
  @media (pointer: coarse) { .tactil { display: inline; } .pc { display: none; } }
  @media (max-width: 700px), (max-height: 500px) {
    .hud { font-size: 12px; padding: 6px 8px; }
    #info { right: 110px; }
    #info b { font-size: 14px; }
    #info .extra { display: none; }
    #fuerza { width: 140px; }
    #panel small { max-width: 55vw; display: block; }
    #viento { min-width: 60px; }
    #vFlecha { font-size: 26px; line-height: 30px; }
    #sonido { top: calc(118px + env(safe-area-inset-top, 0px)); font-size: 18px; }
    #aviso { font-size: 13px; top: calc(48px + env(safe-area-inset-top, 0px)); }
    #poderes { top: calc(46px + env(safe-area-inset-top, 0px)); }
    #poderes .chip { font-size: 11px; padding: 3px 8px; }
    #jefe { font-size: 14px; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
    #fin { font-size: 15px; padding: 16px 20px; }
    #fin h2 { font-size: 22px; }
  }
  @media (max-height: 500px) { #panel small { display: none; } }
  html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
               -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  #fin { inset: 0; margin: auto; width: fit-content; height: fit-content; text-align: center;
         padding: 22px 30px; font-size: 18px; display: none; }
  #fin h2 { margin: 0 0 8px; font-size: 28px; }
  #fin button { margin-top: 14px; font: 600 16px system-ui, sans-serif; padding: 10px 20px;
                border: 0; border-radius: 8px; background: #ffd166; color: #222; cursor: pointer; }
</style>
<script>
  try { navigator.getGamepads(); }
  catch (e) {
    try { Object.defineProperty(navigator, "getGamepads", { value: () => [], configurable: true }); }
    catch (e2) { Navigator.prototype.getGamepads = () => []; }
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@7.54.3/babylon.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babylonjs/havok@1.3.10/lib/umd/HavokPhysics_umd.js"></script>
<script src="assets.js"></script>
<script src="poderes.js"></script>
<script src="sonido.js"></script>
</head>
<body>
<canvas id="c"></canvas>

<div id="info" class="hud">Cargando…</div>
<div id="panel" class="hud">
  <label for="fuerza">Potencia: <b id="fv">10</b></label>
  <input id="fuerza" type="range" min="10" max="100" step="1" value="10" disabled>
  <small class="pc">¡No los dejes cruzar la meta! · Mantén clic izquierdo para tensar, suelta para disparar · Clic derecho y arrastrar: cámara</small>
  <small class="tactil">¡Que no crucen la meta! · Mantén el dedo para tensar, arrastra para apuntar, suelta para disparar</small>
</div>
<div id="viento" class="hud">
  <div>Viento</div>
  <div id="vFlecha">➤</div>
  <div id="vBarras">▯▯▯▯▯</div>
  <div id="vFuerza">Calma</div>
</div>
<button id="sonido" class="hud" title="Sonido">🔊</button>
<div id="aviso" class="hud"></div>
<div id="poderes"></div>
<div id="jefe" class="hud"></div>
<div id="mira"></div>
<button id="modo" class="hud">🎥 Cámara</button>
<div id="fin" class="hud">
  <h2>¡Fin del juego!</h2>
  <div id="finTxt"></div>
  <button id="otra">Jugar de nuevo</button>
</div>
<script>
const info = document.getElementById("info");
const msg = t => { info.textContent = t; };
window.addEventListener("error", e => msg("Error: " + e.message));

(async () => {
  if (typeof BABYLON === "undefined") { msg("No se pudo cargar Babylon.js"); return; }

  const canvas = document.getElementById("c");
  const engine = new BABYLON.Engine(canvas, true);
  engine.setHardwareScalingLevel(1 / Math.min(window.devicePixelRatio || 1, 1.5));
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.11, 0.14, 0.19, 1);

  const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI / 2, 0.85, 30,
                   new BABYLON.Vector3(0, 0, 0), scene);
  camera.attachControl(canvas, true);
  camera.lowerRadiusLimit = 10; camera.upperRadiusLimit = 60;
  // El clic izquierdo queda para disparar; la cámara gira con el derecho o el del medio
  camera.inputs.attached.pointers.buttons = [1, 2];
  canvas.addEventListener("contextmenu", e => e.preventDefault());
  new BABYLON.HemisphericLight("luz", new BABYLON.Vector3(0.3, 1, 0.2), scene);

  engine.runRenderLoop(() => scene.render());
  window.addEventListener("resize", () => engine.resize());

  let havok;
  try {
    // El motor de física (WASM, ~2 MB) se descarga del CDN en vez de ir incrustado en este archivo
    havok = await HavokPhysics({
      locateFile: () => "https://cdn.jsdelivr.net/npm/@babylonjs/havok@1.3.10/lib/umd/HavokPhysics.wasm"
    });
  } catch (e) { msg("No se pudo iniciar la física: " + e.message); return; }
  scene.enablePhysics(new BABYLON.Vector3(0, -9.81, 0), new BABYLON.HavokPlugin(true, havok));

  const V = (x, y, z) => new BABYLON.Vector3(x, y, z);

  // Suelo y paredes
  const ground = BABYLON.MeshBuilder.CreateGround("suelo", { width: 30, height: 30 }, scene);
  const gm = new BABYLON.StandardMaterial("gm", scene);
  gm.diffuseColor = new BABYLON.Color3(0.35, 0.45, 0.35);
  ground.material = gm;
  new BABYLON.PhysicsAggregate(ground, BABYLON.PhysicsShapeType.BOX, { mass: 0 }, scene);

  const pm = new BABYLON.StandardMaterial("pm", scene);
  pm.diffuseColor = new BABYLON.Color3(0.6, 0.65, 0.75);
  pm.alpha = 0.35;
  [[0, 15, 30.5, 0.5], [0, -15, 30.5, 0.5], [15, 0, 0.5, 30.5], [-15, 0, 0.5, 30.5]].forEach(([x, z, w, d], i) => {
    const p = BABYLON.MeshBuilder.CreateBox("pared" + i, { width: w, height: 4, depth: d }, scene);
    p.position.set(x, 2, z);
    p.material = pm;
    p.isPickable = false;
    new BABYLON.PhysicsAggregate(p, BABYLON.PhysicsShapeType.BOX, { mass: 0, restitution: 0.3 }, scene);
  });

  // Materiales
  const piel = new BABYLON.StandardMaterial("piel", scene);
  piel.diffuseColor = new BABYLON.Color3(0.95, 0.75, 0.55);
  const ropas = [[0.2,0.4,0.8],[0.85,0.25,0.25],[0.2,0.7,0.35],[0.75,0.35,0.8],[0.95,0.6,0.15]].map((c, i) => {
    const m = new BABYLON.StandardMaterial("ropa" + i, scene);
    m.diffuseColor = new BABYLON.Color3(...c);
    return m;
  });

  const slider = document.getElementById("fuerza");
  const fv = document.getElementById("fv");
  slider.addEventListener("input", () => { fv.textContent = slider.value; });

  // ---------- Semilla: aleatorio pero igual para todos ----------
  const SEED = (Number(new URLSearchParams(location.search).get("seed")) || 20261126) >>> 0;
  function crearRng(seed) {   // mulberry32
    return () => {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  let rngSpawn, rngViento, rngJefe;
  const reiniciarRng = () => {
    rngSpawn = crearRng(SEED); rngViento = crearRng(SEED ^ 0x9E3779B9); rngJefe = crearRng(SEED ^ 0x51ED270B);
  };
  reiniciarRng();

  // ---------- Dificultad: depende del TIEMPO (igual para todos) ----------
  const DIF = {
    velIni: 1.8, velPorSeg: 0.012, velMax: 6.5,
    spawnIni: 3.0, spawnMin: 0.7, spawnPorSeg: 0.011,
    caosDesde: 40, caosHasta: 220,
    jefePrimero: 90, jefeCada: 120
  };
  const velocidadEn = t => Math.min(DIF.velMax, DIF.velIni + DIF.velPorSeg * t);
  const intervaloEn = t => Math.max(DIF.spawnMin, DIF.spawnIni - DIF.spawnPorSeg * t);

  // ---------- Móvil ----------
  const esMovil = matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
  const encuadrar = () => {
    const asp = engine.getRenderWidth() / engine.getRenderHeight();
    camera.radius = asp < 1 ? Math.min(60, 30 / asp * 0.9) : 32;
    camera.upperRadiusLimit = Math.max(60, camera.radius);
  };
  window.addEventListener("resize", encuadrar);
  window.addEventListener("orientationchange", () => setTimeout(() => { engine.resize(); encuadrar(); }, 200));

  // ---------- Mapa (assets.js), poderes (poderes.js) y sonido (sonido.js) ----------
  if (!window.MAPA) { msg("Falta assets.js junto a index.html"); return; }
  if (!window.PODERES) { msg("Falta poderes.js junto a index.html"); return; }
  const S = window.SONIDO || new Proxy({}, { get: () => () => {} });
  const mapa = MAPA.crear(scene, BABYLON);
  const metaMat = mapa.metaMat;

  const btnSonido = document.getElementById("sonido");
  const pintarSonido = () => { btnSonido.textContent = S.mudo ? "🔇" : "🔊"; };
  if (window.SONIDO) {
    pintarSonido();
    btnSonido.addEventListener("pointerdown", e => e.stopPropagation());
    btnSonido.addEventListener("click", () => { S.alternar(); pintarSonido(); });
  } else btnSonido.style.display = "none";

  // ---------- Tipos de ragdoll (desde = segundos de partida) ----------
  const TIPOS = {
    normal:   { nombre: "Normal",   esc: 1.0,  vel: 1.0, vidas: 1, puntos: 1,  desde: 0,   peso: 10 },
    veloz:    { nombre: "Veloz",    esc: 0.8,  vel: 2.0, vidas: 1, puntos: 2,  desde: 25,  peso: 4,
                color: [1, 0.85, 0.1], desc: "corre el doble de rápido" },
    dorado:   { nombre: "Dorado",   esc: 0.7,  vel: 1.9, vidas: 1, puntos: 10, desde: 45,  peso: 0.6,
                color: [1, 0.75, 0.1], brillo: [0.5, 0.35, 0], caos: 1, desc: "raro y errático: vale 10 y da +2 flechas" },
    tanque:   { nombre: "Tanque",   esc: 1.35, vel: 0.65, vidas: 3, puntos: 3, desde: 60,  peso: 3,
                color: [0.4, 0.4, 0.45], desc: "aguanta 3 flechazos (o 1 con potencia ≥ 85)" },
    mitosis:  { nombre: "Mitosis",  esc: 1.1,  vel: 0.9, vidas: 1, puntos: 1,  desde: 80,  peso: 3,
                color: [0.3, 0.9, 0.4], divide: true, desc: "al caer se divide en 2 minis" },
    ninja:    { nombre: "Ninja",    esc: 0.95, vel: 1.1, vidas: 1, puntos: 3,  desde: 100, peso: 3,
                color: [0.12, 0.12, 0.18], esquiva: true, desc: "esquiva las flechas que ve venir" },
    fantasma: { nombre: "Fantasma", esc: 1.0,  vel: 0.9, vidas: 1, puntos: 3,  desde: 130, peso: 3,
                color: [0.85, 0.9, 1], fantasma: true, desc: "se vuelve intangible a ratos" },
    mini:     { nombre: "Mini",     esc: 0.6,  vel: 1.5, vidas: 1, puntos: 1,  desde: Infinity, peso: 0,
                color: [0.3, 0.9, 0.4] },
    jefe:     { nombre: "JEFE",     esc: 2.1,  vel: 0.45, vidas: 5, puntos: 25, desde: Infinity, peso: 0,
                color: [0.55, 0.05, 0.12], brillo: [0.15, 0, 0.03], jefe: true, cuentaPasar: 5,
                desc: "5 flechazos para derribarlo. Si cruza, cuenta como 5" }
  };
  let vistos = new Set(["normal", "mini"]);

  function elegirTipo() {
    const disp = Object.entries(TIPOS).filter(([, t]) => tiempo >= t.desde && t.peso > 0);
    let r = rngSpawn() * disp.reduce((s, [, t]) => s + t.peso, 0);
    for (const [id, t] of disp) { r -= t.peso; if (r <= 0) return id; }
    return "normal";
  }

  const avisoEl = document.getElementById("aviso");
  let avisoT = 0;
  function aviso(html, seg = 3.5) { avisoEl.innerHTML = html; avisoEl.style.display = "block"; avisoT = seg; }

  const matColor = (rgb, brillo) => {
    const m = new BABYLON.StandardMaterial("m", scene);
    m.diffuseColor = new BABYLON.Color3(...rgb);
    if (brillo) m.emissiveColor = new BABYLON.Color3(...brillo);
    return m;
  };

  // ---------- Modo resistir ----------
  const X_SALIDA = -14.5, X_META = MAPA.CFG.xMeta;
  const MAX_PASAN = 30;
  camera.alpha = -Math.PI / 2;
  encuadrar();

  // ---------- Corredores ----------
  let corredores = [];
  const duenio = new Map();
  let aplastados = 0, puntos = 0, pasaron = 0, velocidad = DIF.velIni, jugando = true, proximo = 2;
  let tiempo = 0, ultimoSeg = -1, proximoJefe = DIF.jefePrimero, jefesMuertos = 0;
  const reloj = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

  function spawnProgramado() {
    const tipo = elegirTipo();
    const ip = Math.floor(rngSpawn() * mapa.puertas.length);
    const dz = (rngSpawn() - 0.5) * 1.4;
    const semilla = Math.floor(rngSpawn() * 4294967296);
    const p = mapa.puertas[ip];
    mapa.brillarPuerta(ip);
    crearCorredor(tipo, { x: p.x, z: p.z + dz, rng: crearRng(semilla) });
  }

  function spawnJefe() {
    const ip = Math.floor(rngJefe() * mapa.puertas.length);
    const p = mapa.puertas[ip];
    mapa.brillarPuerta(ip);
    crearCorredor("jefe", { x: p.x + 0.6, z: p.z, rng: crearRng(Math.floor(rngJefe() * 4294967296)) });
    aviso("⚠️ <b>¡Llega un JEFE!</b> 5 flechazos para derribarlo · si cruza cuenta como 5", 4);
    S.jefe();
  }

  function crearCorredor(tipoId, op) {
    const T = TIPOS[tipoId], e = T.esc, rnd = op.rng;
    if (!vistos.has(tipoId)) {
      vistos.add(tipoId);
      if (!T.jefe) aviso("¡Nuevo! <b>" + T.nombre + "</b>: " + T.desc + " · vale " + T.puntos);
    }
    const x0 = op.x, z = op.z;
    const mats = [];
    let ropa = ropas[Math.floor(rnd() * ropas.length)], pielM = piel;
    if (T.color) { ropa = matColor(T.color, T.brillo); mats.push(ropa); }
    if (T.fantasma) { pielM = piel.clone("pf"); mats.push(pielM); }
    const partes = [];

    const parte = (w, h, d, dx, dy, mat, esfera) => {
      const m = esfera
        ? BABYLON.MeshBuilder.CreateSphere("p", { diameter: w * e, segments: esMovil ? 8 : 16 }, scene)
        : BABYLON.MeshBuilder.CreateBox("p", { width: d * e, height: h * e, depth: w * e }, scene);
      m.position.set(x0, (1.45 + dy) * e, z + dx * e);
      m.material = mat;
      const agg = new BABYLON.PhysicsAggregate(m,
        esfera ? BABYLON.PhysicsShapeType.SPHERE : BABYLON.PhysicsShapeType.BOX,
        { mass: e * e * e, friction: 0.6 }, scene);
      partes.push({ m, agg });
      return agg;
    };
    const unir = (a, b, pa, pb) => {
      const giro = p => V(p.z * e, p.y * e, p.x * e);
      const c = new BABYLON.BallAndSocketConstraint(giro(pa), giro(pb), V(0, 1, 0), V(0, 1, 0), scene);
      a.body.addConstraint(b.body, c);
      c.isCollisionsEnabled = false;
    };

    const torso  = parte(0.6, 0.8, 0.3, 0, 0, ropa);
    const cabeza = parte(0.4, 0, 0, 0, 0.65, pielM, true);
    const bSI = parte(0.15, 0.4, 0.15, -0.38,  0.1, ropa);
    const bII = parte(0.15, 0.4, 0.15, -0.38, -0.3, pielM);
    const bSD = parte(0.15, 0.4, 0.15,  0.38,  0.1, ropa);
    const bID = parte(0.15, 0.4, 0.15,  0.38, -0.3, pielM);
    const mI  = parte(0.2, 0.5, 0.2, -0.15, -0.65, ropa);
    const pI  = parte(0.2, 0.5, 0.2, -0.15, -1.15, pielM);
    const mD  = parte(0.2, 0.5, 0.2,  0.15, -0.65, ropa);
    const pD  = parte(0.2, 0.5, 0.2,  0.15, -1.15, pielM);

    unir(torso, cabeza, V(0, 0.425, 0), V(0, -0.225, 0));
    unir(torso, bSI, V(-0.38, 0.3, 0), V(0, 0.2, 0));
    unir(bSI, bII, V(0, -0.2, 0), V(0, 0.2, 0));
    unir(torso, bSD, V(0.38, 0.3, 0), V(0, 0.2, 0));
    unir(bSD, bID, V(0, -0.2, 0), V(0, 0.2, 0));
    unir(torso, mI, V(-0.15, -0.4, 0), V(0, 0.25, 0));
    unir(mI, pI, V(0, -0.25, 0), V(0, 0.25, 0));
    unir(torso, mD, V(0.15, -0.4, 0), V(0, 0.25, 0));
    unir(mD, pD, V(0, -0.25, 0), V(0, 0.25, 0));

    if (tipoId === "tanque") {
      const casco = BABYLON.MeshBuilder.CreateSphere("casco", { diameter: 0.5 * e, slice: 0.5 }, scene);
      casco.material = matColor([0.25, 0.3, 0.25]); mats.push(casco.material);
      casco.parent = cabeza.transformNode; casco.position.y = 0.04 * e; casco.isPickable = false;
    }
    if (tipoId === "ninja") {
      const banda = BABYLON.MeshBuilder.CreateTorus("banda", { diameter: 0.4 * e, thickness: 0.06 * e }, scene);
      banda.material = matColor([0.9, 0.1, 0.1]); mats.push(banda.material);
      banda.parent = cabeza.transformNode; banda.position.y = 0.06 * e; banda.isPickable = false;
    }
    if (T.jefe) {
      const corona = BABYLON.MeshBuilder.CreateCylinder("corona",
        { height: 0.18 * e, diameterTop: 0.42 * e, diameterBottom: 0.34 * e, tessellation: 8 }, scene);
      corona.material = matColor([1, 0.8, 0.1], [0.4, 0.3, 0]); mats.push(corona.material);
      corona.parent = cabeza.transformNode; corona.position.y = 0.2 * e; corona.isPickable = false;
    }

    partes.forEach(p => {
      p.agg.body.setMotionType(BABYLON.PhysicsMotionType.ANIMATED);
      p.mascara = p.agg.shape.filterMembershipMask;
    });
    const huesos = { torso, cabeza, bSI, bII, bSD, bID, mI, pI, mD, pD };
    const c = { tipo: tipoId, T, e, rng: rnd, partes, torso, huesos, mats, ropa, x: x0, z,
                t: 0, fase: rnd(), vivo: true, timer: 0, empuje: null,
                rumbo: 0, desvio: 0, desvioObj: 0, tCambio: rnd() * 1.5,
                velMult: 1, vidas: T.vidas, bolasVistas: new Set(op.bolasVistas || []),
                aturdido: 0, flash: 0, dash: null, cdEsquive: 0,
                tFant: 1 + rnd() * 2, intangible: false };
    corredores.push(c);
    partes.forEach(p => duenio.set(p.agg.body, c));
    return c;
  }

  function borrar(c) {
    c.partes.forEach(p => { duenio.delete(p.agg.body); p.agg.dispose(); p.m.dispose(); });
    c.mats.forEach(m => m.dispose());
    corredores = corredores.filter(o => o !== c);
  }

  const jefeEl = document.getElementById("jefe");
  function hudJefe() {
    const j = corredores.find(c => c.vivo && c.T.jefe);
    if (!j) { jefeEl.style.display = "none"; return; }
    jefeEl.style.display = "block";
    jefeEl.innerHTML = "👑 JEFE " + "❤️".repeat(j.vidas) + "🖤".repeat(TIPOS.jefe.vidas - j.vidas);
  }

  function hud() {
    const peligro = pasaron >= MAX_PASAN * 0.8 ? " style='color:#ff5555'" : "";
    info.innerHTML = "Eliminados: <b>" + aplastados + "</b> · Puntos: <b>" + puntos +
      "</b> · Pasaron: <b" + peligro + ">" + pasaron + "/" + MAX_PASAN +
      "</b> · Tiempo: <b>" + reloj(tiempo) + "</b>" +
      "<span class='extra'> · Velocidad: <b>" + velocidad.toFixed(1) +
      "</b> · Caos: <b>" + Math.round(nivelCaos() * 100) + "%</b></span>";
    hudJefe();
  }

  function finJuego() {
    jugando = false;
    S.tensarFin(); S.fin();
    document.getElementById("finTxt").innerHTML =
      "Pasaron " + MAX_PASAN + " ragdolls la meta.<br>Eliminaste <b>" + aplastados + "</b> · " +
      puntos + " puntos · " + jefesMuertos + " jefe" + (jefesMuertos === 1 ? "" : "s") +
      " · resististe " + reloj(tiempo) + ".<br><small>Semilla: " + SEED + "</small>";
    document.getElementById("fin").style.display = "block";
  }

  document.getElementById("otra").addEventListener("click", () => {
    [...corredores].forEach(borrar);
    [...flechas].forEach(quitarFlecha);
    aplastados = 0; puntos = 0; pasaron = 0; velocidad = DIF.velIni; proximo = 2; jugando = true;
    tiempo = 0; ultimoSeg = -1; vistos = new Set(["normal", "mini"]);
    proximoJefe = DIF.jefePrimero; jefesMuertos = 0;
    reiniciarRng(); reiniciarViento(); PODERES.reset();
    document.getElementById("fin").style.display = "none";
    hud();
  });

  // ---------- Animación prehecha de caminar / correr ----------
  const CICLOS = {
    caminar: { cadera: [22, 14, 4, -6, -16, -8, 10, 20],
               rodilla: [4, 14, 8, 6, 30, 58, 40, 10],
               paso: 1.4, incl: 5, brazo: 0.7, codo: 20, bote: 0.03 },
    correr:  { cadera: [35, 20, 0, -22, -32, -5, 25, 38],
               rodilla: [20, 38, 22, 30, 85, 105, 70, 30],
               paso: 2.4, incl: 14, brazo: 1.0, codo: 85, bote: 0.07 }
  };
  const GR = Math.PI / 180;
  const lerp = (a, b, k) => a + (b - a) * k;
  function muestra(arr, f) {
    const n = arr.length, x = (((f % 1) + 1) % 1) * n, i = Math.floor(x), t = x - i;
    const p0 = arr[(i - 1 + n) % n], p1 = arr[i % n], p2 = arr[(i + 1) % n], p3 = arr[(i + 2) % n];
    return 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t +
                  (-p0 + 3 * p1 - 3 * p2 + p3) * t * t * t);
  }
  const rotZ = (x, y, a) => [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];

  function animar(c, dt, vel) {
    const W = CICLOS.caminar, R = CICLOS.correr;
    const k = Math.min(1, Math.max(0, (vel / c.e - 3) / 3));
    const mix = (a, b) => lerp(a, b, k);
    c.fase = (c.fase + vel / c.e * dt / mix(W.paso, R.paso)) % 1;
    const aT = -mix(W.incl, R.incl) * GR;
    const local = [];
    const piv = (px, py) => rotZ(px, py, aT);
    const pierna = (muslo, canilla, lado, off) => {
      const f = c.fase + off;
      const cad = mix(muestra(W.cadera, f), muestra(R.cadera, f)) * GR;
      const rod = mix(muestra(W.rodilla, f), muestra(R.rodilla, f)) * GR;
      const [hx, hy] = piv(0, -0.4);
      const a1 = cad, a2 = cad - rod;
      const kx = hx + Math.sin(a1) * 0.5, ky = hy - Math.cos(a1) * 0.5;
      local.push([muslo, hx + Math.sin(a1) * 0.25, hy - Math.cos(a1) * 0.25, lado, a1]);
      local.push([canilla, kx + Math.sin(a2) * 0.25, ky - Math.cos(a2) * 0.25, lado, a2]);
      return { cad, pie: ky - Math.cos(a2) * 0.5 };
    };
    const L = pierna(c.huesos.mI, c.huesos.pI, -0.15, 0);
    const Dr = pierna(c.huesos.mD, c.huesos.pD, 0.15, 0.5);
    const brazo = (sup, inf, lado, cadera, off) => {
      const sh = -cadera * mix(W.brazo, R.brazo);
      const codo = (mix(W.codo, R.codo) + 10 * Math.sin((c.fase + off) * 2 * Math.PI)) * GR;
      const [sx, sy] = piv(0, 0.3);
      const a1 = sh, a2 = sh + codo;
      const ex = sx + Math.sin(a1) * 0.4, ey = sy - Math.cos(a1) * 0.4;
      local.push([sup, sx + Math.sin(a1) * 0.2, sy - Math.cos(a1) * 0.2, lado, a1]);
      local.push([inf, ex + Math.sin(a2) * 0.2, ey - Math.cos(a2) * 0.2, lado, a2]);
    };
    brazo(c.huesos.bSI, c.huesos.bII, -0.38, L.cad, 0);
    brazo(c.huesos.bSD, c.huesos.bID, 0.38, Dr.cad, 0.5);
    const [cx, cy] = piv(0, 0.65);
    local.push([c.huesos.cabeza, cx, cy, 0, aT]);
    local.push([c.huesos.torso, 0, 0, 0, aT]);
    const y0 = 0.06 - Math.min(L.pie, Dr.pie) +
               mix(W.bote, R.bote) * Math.abs(Math.sin(c.fase * 2 * Math.PI));
    const ch = Math.cos(c.rumbo), sh = Math.sin(c.rumbo), e = c.e;
    for (const [p, x, y, z, a] of local) {
      const q = BABYLON.Quaternion.RotationYawPitchRoll(-c.rumbo, 0, a);
      p.body.setTargetTransform(V(c.x + e * (x * ch - z * sh), e * (y0 + y), c.z + e * (x * sh + z * ch)), q);
    }
  }

  // ---------- Trayectoria + habilidades ----------
  const CAOS = { anguloMax: 70, cambioMin: 0.6, cambioMax: 2.5, giro: 2.5 };
  const nivelCaos = () => Math.min(1, Math.max(0, (tiempo - DIF.caosDesde) / (DIF.caosHasta - DIF.caosDesde)));
  const bolasVivas = new Set();

  function intentarEsquivar(c) {
    if (c.cdEsquive > 0 || c.dash) return;
    for (const b of bolasVivas) {
      if (c.bolasVistas.has(b.id)) continue;
      const p = b.agg.transformNode.position, v = b.agg.body.getLinearVelocity();
      const rx = c.x - p.x, rz = c.z - p.z, vv = v.x * v.x + v.z * v.z;
      if (vv < 1) continue;
      const tMin = (rx * v.x + rz * v.z) / vv;
      if (tMin < 0 || tMin > 0.6) continue;
      const dx = rx - v.x * tMin, dz = rz - v.z * tMin;
      if (dx * dx + dz * dz > 1.5 * 1.5) continue;
      c.bolasVistas.add(b.id);
      if (c.rng() > 0.75) continue;
      const l = Math.sqrt(vv), lado = (dx * -v.z + dz * v.x) >= 0 ? 1 : -1;
      c.dash = { vx: -v.z / l * lado * 14, vz: v.x / l * lado * 14, t: 0.22 };
      c.cdEsquive = 2.2;
      return;
    }
  }

  function actualizarFantasma(c, dt) {
    c.tFant -= dt;
    if (c.tFant <= 0) {
      c.intangible = !c.intangible;
      c.tFant = c.intangible ? 1.2 : 1.5 + c.rng() * 1.5;
      c.partes.forEach(p => { p.agg.shape.filterMembershipMask = c.intangible ? 0 : p.mascara; });
    }
    const a = c.intangible ? 0.15 : (c.tFant < 0.4 ? 0.5 + 0.4 * Math.sin(tiempo * 40) : 0.9);
    c.mats.forEach(m => { m.alpha = a; });
  }

  function mover(c, dt) {
    const caos = c.T.jefe ? 0.3 : Math.max(nivelCaos(), c.T.caos || 0);
    c.tCambio -= dt;
    if (c.tCambio <= 0) {
      c.desvioObj = (c.rng() * 2 - 1) * CAOS.anguloMax * GR * caos;
      c.tCambio = lerp(CAOS.cambioMax, CAOS.cambioMin, caos) * (0.5 + c.rng());
      if (caos > 0.5 && c.rng() < 0.15 * caos) c.velMult = 1.6;
    }
    if (c.z > 11 && c.desvioObj > 0) c.desvioObj = -Math.abs(c.desvioObj);
    if (c.z < -11 && c.desvioObj < 0) c.desvioObj = Math.abs(c.desvioObj);
    c.desvio += (c.desvioObj - c.desvio) * Math.min(1, CAOS.giro * dt * (0.5 + caos));
    c.velMult += (1 - c.velMult) * Math.min(1, dt * 1.5);
    c.rumbo = c.desvio;

    if (c.aturdido > 0) c.aturdido -= dt;
    const v = velocidad * c.T.vel * c.velMult * (c.aturdido > 0 ? 0.25 : 1);
    c.x += Math.cos(c.rumbo) * v * dt;
    c.z += Math.sin(c.rumbo) * v * dt;

    if (c.T.esquiva) {
      c.cdEsquive -= dt;
      intentarEsquivar(c);
      if (c.dash) {
        c.x += c.dash.vx * dt; c.z += c.dash.vz * dt;
        if ((c.dash.t -= dt) <= 0) c.dash = null;
      }
    }
    c.x = Math.max(X_SALIDA, c.x);
    c.z = Math.max(-13, Math.min(13, c.z));
    if (c.T.fantasma) actualizarFantasma(c, dt);
    if (c.flash > 0) {
      c.flash -= dt;
      c.ropa.emissiveColor = c.flash > 0 ? new BABYLON.Color3(0.9, 0.1, 0.1)
                           : (c.T.brillo ? new BABYLON.Color3(...c.T.brillo) : new BABYLON.Color3(0, 0, 0));
    }
    return v;
  }

  let flashMeta = 0;
  scene.onBeforeRenderObservable.add(() => {
    const dt = Math.min(engine.getDeltaTime() / 1000, 0.05);
    const dtR = dt * PODERES.factorRagdolls();
    mapa.actualizar(dt);
    PODERES.actualizar(dt);
    if (avisoT > 0 && (avisoT -= dt) <= 0) avisoEl.style.display = "none";
    if (flashMeta > 0) {
      flashMeta -= dt;
      metaMat.emissiveColor = new BABYLON.Color3(flashMeta > 0 ? 1 : 0.25, flashMeta > 0 ? 0.4 : 0, 0);
    }

    if (jugando) {
      tiempo += dt;
      velocidad = velocidadEn(tiempo);
      if (Math.floor(tiempo) !== ultimoSeg) { ultimoSeg = Math.floor(tiempo); hud(); }
      proximo -= dt;
      if (proximo <= 0) {
        spawnProgramado();
        proximo += intervaloEn(tiempo) * (0.6 + rngSpawn() * 0.8);
      }
      if (tiempo >= proximoJefe) { spawnJefe(); proximoJefe += DIF.jefeCada; }
    }

    for (const c of [...corredores]) {
      if (c.vivo) {
        c.t += dtR;
        const v = mover(c, dtR);
        animar(c, dtR, Math.max(v, 1));
        if (c.x > X_META) {
          borrar(c);
          if (jugando) {
            pasaron += c.T.cuentaPasar || 1; flashMeta = 0.25; S.meta(); hud();
            if (pasaron >= MAX_PASAN) finJuego();
          }
        }
      } else {
        if (c.empuje) aplicarEmpuje(c);
        c.timer -= dt;
        if (c.timer <= 0) borrar(c);
      }
    }
  });

  // ---------- Viento: ráfagas de 10 s separadas por periodos de calma ----------
  const VIENTO = { duracion: 10, calmaMin: 5, calmaMax: 9, calmaInicial: 12,
                   max: 18, transicion: 1.5, nStreaks: esMovil ? 35 : 70 };
  const viento = { actual: V(0, 0, 0), desde: V(0, 0, 0), hacia: V(0, 0, 0), t: 0, tTrans: 1, soplando: false };
  const uiViento = document.getElementById("viento");
  const uiFlecha = document.getElementById("vFlecha");
  const uiFuerza = document.getElementById("vFuerza");
  const uiBarras = document.getElementById("vBarras");

  function siguienteFaseViento() {
    viento.desde = viento.actual.clone(); viento.tTrans = 0;
    if (viento.soplando) {
      viento.soplando = false;
      viento.hacia = V(0, 0, 0);
      viento.t = VIENTO.calmaMin + rngViento() * (VIENTO.calmaMax - VIENTO.calmaMin);
    } else {
      viento.soplando = true;
      const ang = rngViento() * Math.PI * 2;
      const fuerza = (0.25 + 0.75 * rngViento()) * VIENTO.max;
      viento.hacia = V(Math.cos(ang) * fuerza, 0, Math.sin(ang) * fuerza);
      viento.t = VIENTO.duracion;
    }
  }
  function reiniciarViento() {
    viento.actual = V(0, 0, 0); viento.desde = V(0, 0, 0); viento.hacia = V(0, 0, 0);
    viento.soplando = false; viento.t = VIENTO.calmaInicial; viento.tTrans = 1;
  }
  reiniciarViento();

  const streakMat = new BABYLON.StandardMaterial("aire", scene);
  streakMat.emissiveColor = new BABYLON.Color3(1, 1, 1);
  streakMat.disableLighting = true;
  streakMat.alpha = 0;
  const streakBase = BABYLON.MeshBuilder.CreateBox("aire", { width: 0.03, height: 0.03, depth: 1 }, scene);
  streakBase.material = streakMat; streakBase.isPickable = false; streakBase.isVisible = false;
  const streaks = [];
  for (let i = 0; i < VIENTO.nStreaks; i++) {
    const s = streakBase.createInstance("a" + i);
    s.isPickable = false;
    s.position.set((Math.random() * 2 - 1) * 15, 0.3 + Math.random() * 5, (Math.random() * 2 - 1) * 15);
    s.vel = 0.7 + Math.random() * 0.6;
    streaks.push(s);
  }
  const envolver = v => (v > 15 ? v - 30 : v < -15 ? v + 30 : v);

  scene.onBeforeRenderObservable.add(() => {
    const dt = Math.min(engine.getDeltaTime() / 1000, 0.05);
    if (jugando) {
      viento.t -= dt;
      if (viento.t <= 0) siguienteFaseViento();
    }
    viento.tTrans = Math.min(1, viento.tTrans + dt / VIENTO.transicion);
    const s = viento.tTrans * viento.tTrans * (3 - 2 * viento.tTrans);
    viento.actual = BABYLON.Vector3.Lerp(viento.desde, viento.hacia, s);
    const w = viento.actual, f = w.length(), k = f / VIENTO.max;
    streakMat.alpha = 0.45 * Math.min(1, k * 1.3);
    const yaw = Math.atan2(w.x, w.z);
    for (const st of streaks) {
      st.position.x = envolver(st.position.x + w.x * 0.7 * st.vel * dt);
      st.position.z = envolver(st.position.z + w.z * 0.7 * st.vel * dt);
      st.rotation.y = yaw;
      st.scaling.z = 0.3 + 1.7 * k;
    }
    const fwd = camera.target.subtract(camera.position); fwd.y = 0; fwd.normalize();
    const der = V(fwd.z, 0, -fwd.x);
    const ang = Math.atan2(BABYLON.Vector3.Dot(w, der), BABYLON.Vector3.Dot(w, fwd));
    uiFlecha.style.transform = `rotate(${ang - Math.PI / 2}rad)`;
    uiFlecha.style.opacity = f < 0.3 ? 0.25 : 1;
    const nivel = Math.round(k * 5);
    uiBarras.textContent = "▮".repeat(nivel) + "▯".repeat(5 - nivel);
    uiFuerza.innerHTML = f < 0.3
      ? "Calma<br><small>viento en " + Math.ceil(viento.t) + " s</small>"
      : (f * 2.5).toFixed(0) + " km/h";
    uiViento.style.borderColor = `hsl(${200 - 200 * k}, 80%, 60%)`;
  });

  // ---------- Flechas ----------
  const colorPotencia = p => {
    const k = Math.min(1, Math.max(0, (p - 10) / 90));
    return BABYLON.Color3.Lerp(new BABYLON.Color3(0.55, 0.55, 0.58), new BABYLON.Color3(1, 0.08, 0.05), k);
  };
  const matsAstil = [];
  for (let i = 0; i <= 9; i++) {
    const m = new BABYLON.StandardMaterial("astil" + i, scene);
    m.diffuseColor = colorPotencia(10 + i * 10);
    m.emissiveColor = new BABYLON.Color3(0.35 * i / 9, 0, 0);
    matsAstil.push(m);
  }
  const materialAstil = p => matsAstil[Math.round(Math.min(1, Math.max(0, (p - 10) / 90)) * 9)];
  const matPunta = matColor([0.75, 0.75, 0.8]); matPunta.specularColor = new BABYLON.Color3(1, 1, 1);
  const matPlumas = matColor([0.95, 0.95, 0.95]);
  const matTitan = matColor([1, 0.8, 0.15], [0.7, 0.45, 0]);
  const matExplo = matColor([1, 0.55, 0.1], [1, 0.4, 0]); matExplo.disableLighting = true;

  const FLECHA = { largo: 1.2, vuelo: 4, clavada: 5, profundidad: 0.3, abanico: 5 };
  const ARRIBA = V(0, 1, 0);
  const flechas = new Set();
  const impactos = [];
  const POT_ROMPE_TANQUE = 85;
  let idBola = 0, ultimoSonidoPared = 0;

  function mallaFlecha(potencia, titan) {
    const raiz = new BABYLON.TransformNode("flecha", scene);
    const L = FLECHA.largo;
    const astil = BABYLON.MeshBuilder.CreateCylinder("astil", { height: L, diameter: titan ? 0.08 : 0.05, tessellation: 6 }, scene);
    astil.material = titan ? matTitan : materialAstil(potencia);
    const punta = BABYLON.MeshBuilder.CreateCylinder("punta",
      { height: 0.2, diameterTop: 0, diameterBottom: titan ? 0.2 : 0.13, tessellation: 6 }, scene);
    punta.position.y = L / 2 + 0.1; punta.material = titan ? matTitan : matPunta;
    const pl1 = BABYLON.MeshBuilder.CreateBox("pluma", { width: 0.2, height: 0.22, depth: 0.01 }, scene);
    pl1.position.y = -L / 2 + 0.12; pl1.material = matPlumas;
    const pl2 = pl1.clone("pluma2"); pl2.rotation.y = Math.PI / 2;
    for (const m of [astil, punta, pl1, pl2]) { m.parent = raiz; m.isPickable = false; }
    raiz.rotationQuaternion = new BABYLON.Quaternion();
    return raiz;
  }
  const orientar = (nodo, dir) => BABYLON.Quaternion.FromUnitVectorsToRef(ARRIBA, dir, nodo.rotationQuaternion);

  function soltarObservadores(f) {
    if (!f.vuelaObs) return;
    scene.onAfterPhysicsObservable.remove(f.vuelaObs);
    scene.onBeforePhysicsObservable.remove(f.vientoObs);
    f.vuelaObs = null;
  }

  function quitarFlecha(f) {
    soltarObservadores(f);
    bolasVivas.delete(f.registro);
    clearTimeout(f.timer);
    if (f.agg) { f.agg.dispose(); f.esfera.dispose(); f.agg = null; }
    if (!f.raiz.isDisposed()) f.raiz.dispose();
    flechas.delete(f);
  }

  function clavar(f, punto, padre) {
    if (f.clavada) return;
    f.clavada = true;
    const d = f.dir;
    soltarObservadores(f);
    bolasVivas.delete(f.registro);
    f.agg.dispose(); f.esfera.dispose(); f.agg = null;
    f.raiz.position.copyFrom(punto.add(d.scale(FLECHA.profundidad - FLECHA.largo / 2)));
    orientar(f.raiz, d);
    if (padre) f.raiz.setParent(padre);
    clearTimeout(f.timer);
    f.timer = setTimeout(() => quitarFlecha(f), FLECHA.clavada * 1000);
  }

  function explotar(punto, radio, clave) {
    S.explosion();
    const bola = BABYLON.MeshBuilder.CreateSphere("explo", { diameter: 1, segments: 8 }, scene);
    bola.position.copyFrom(punto); bola.material = matExplo.clone("ex"); bola.isPickable = false;
    let t = 0;
    const obs = scene.onBeforeRenderObservable.add(() => {
      t += engine.getDeltaTime() / 1000;
      const k = Math.min(1, t / 0.35);
      bola.scaling.setAll(radio * 2 * (0.3 + 0.7 * k));
      bola.material.alpha = 0.7 * (1 - k);
      if (k >= 1) { scene.onBeforeRenderObservable.remove(obs); bola.material.dispose(); bola.dispose(); }
    });
    for (const c of [...corredores]) {
      if (!c.vivo || c.intangible) continue;
      const p = c.huesos.torso.transformNode.getAbsolutePosition();
      const d = p.subtract(punto);
      if (d.length() > radio + 0.5 * c.e) continue;
      d.y = 0;
      const dir = d.lengthSquared() > 1e-4 ? d.normalize() : V(1, 0, 0);
      golpear(c, c.huesos.torso.body, dir.scale(90).add(V(0, 20, 0)), clave);
    }
  }

  function golpear(c, cuerpo, vel, bolaId) {
    if (!c.vivo || c.intangible || c.bolasVistas.has("g" + bolaId)) return;
    c.bolasVistas.add("g" + bolaId);
    if (c.T.jefe) {
      c.vidas--;
      if (c.vidas > 0) { c.flash = 0.2; c.aturdido = 0.35; hudJefe(); S.metal(); S.golpe(true); return; }
    } else if (c.vidas > 1 && vel.length() < POT_ROMPE_TANQUE) {
      c.vidas--; c.flash = 0.18; c.aturdido = 0.5; S.metal();
      return;
    }
    derribar(c, cuerpo, vel, bolaId);
  }

  function derribar(c, cuerpo, vel, bolaId) {
    c.vivo = false;
    c.timer = 2.5;
    S.golpe(c.e > 1.2);
    c.partes.forEach(p => {
      p.agg.shape.filterMembershipMask = p.mascara;
      p.agg.body.setMotionType(BABYLON.PhysicsMotionType.DYNAMIC);
    });
    c.mats.forEach(m => { m.alpha = 1; });
    const dirH = V(vel.x, 0, vel.z);
    if (dirH.lengthSquared() < 1e-4) dirH.set(Math.cos(c.rumbo), 0, Math.sin(c.rumbo));
    dirH.normalize();
    c.empuje = { dir: dirH, rapidez: Math.max(8, vel.length()), golpeado: cuerpo, cuadros: 2 };
    if (jugando) {
      aplastados++;
      puntos += c.T.puntos * PODERES.multPuntos();
      if (PODERES.otorgar(c.tipo)) S.poder();
      if (c.T.jefe) {
        jefesMuertos++;
        const nv = PODERES.jefeDerrotado();
        S.jefeMuerto();
        aviso("👑 <b>¡Jefe derrotado!</b> Flecha del Titán <b>Nv " + nv +
              "</b>: suelta con tensión máxima (100) para usarla", 5);
      }
      hud();
    }
    if (c.T.divide && jugando) {
      for (const lado of [-1, 1]) {
        const m = crearCorredor("mini", { x: c.x, z: Math.max(-12, Math.min(12, c.z + lado * 1.2)),
                                          rng: crearRng(Math.floor(c.rng() * 4294967296)),
                                          bolasVistas: ["g" + bolaId] });
        m.desvio = m.desvioObj = lado * 45 * GR; m.tCambio = 0.8;
      }
    }
  }

  function aplicarEmpuje(c) {
    const e = c.empuje;
    const r = () => Math.random() - 0.5;
    const base = e.dir.scale(e.rapidez * 0.4 / c.e).add(V(0, 3, 0));
    c.partes.forEach(p => {
      const b = p.agg.body;
      b.setLinearVelocity(base.add(V(r(), r() * 0.5, r())));
      if (e.cuadros === 2) b.setAngularVelocity(V(r() * 8, r() * 8, r() * 8));
    });
    if (e.cuadros === 2)
      e.golpeado.applyImpulse(e.dir.scale(e.rapidez * 0.5), e.golpeado.transformNode.getAbsolutePosition());
    if (--e.cuadros <= 0) c.empuje = null;
  }

  function objetivoGuia(pos, dir) {
    let mejor = null, dMin = 18;
    for (const c of corredores) {
      if (!c.vivo || c.intangible) continue;
      const p = c.huesos.torso.transformNode.getAbsolutePosition();
      const d = p.subtract(pos), l = d.length();
      if (l < dMin && BABYLON.Vector3.Dot(d, dir) / l > 0.3) { dMin = l; mejor = p; }
    }
    return mejor;
  }

  function lanzarFlecha(origen, dir, potencia, mod) {
    const esfera = BABYLON.MeshBuilder.CreateSphere("fis", { diameter: 0.18, segments: 4 }, scene);
    esfera.isVisible = false; esfera.isPickable = false;
    esfera.position.copyFrom(origen);
    const agg = new BABYLON.PhysicsAggregate(esfera, BABYLON.PhysicsShapeType.SPHERE,
      { mass: 3, restitution: 0, friction: 1 }, scene);
    const vel = dir.scale(potencia);
    agg.body.setLinearVelocity(vel);
    try { agg.body.setGravityFactor(mod.recta ? 0 : 0.35); } catch (e) {}

    const id = ++idBola;
    const f = { id, agg, esfera, raiz: mallaFlecha(potencia, mod.titan), dir: dir.clone(), velPrevia: vel.clone(),
                clavada: false, registro: { id, agg },
                perfora: mod.perfora, explosion: mod.explosion, guia: mod.guia, recta: mod.recta };
    const ponerMalla = () => {
      orientar(f.raiz, f.dir);
      f.raiz.position.copyFrom(esfera.position.subtract(f.dir.scale(FLECHA.largo / 2)));
    };
    ponerMalla();
    flechas.add(f);
    bolasVivas.add(f.registro);

    f.vuelaObs = scene.onAfterPhysicsObservable.add(() => {
      const v = agg.body.getLinearVelocity();
      f.velPrevia = v.clone();
      if (v.lengthSquared() > 0.5) f.dir = v.normalizeToNew();
      ponerMalla();
    });
    f.vientoObs = scene.onBeforePhysicsObservable.add(() => {
      const dtF = Math.min(engine.getDeltaTime() / 1000, 0.05);
      const v = agg.body.getLinearVelocity();
      if (!f.recta) v.addInPlace(viento.actual.scale(dtF));
      if (f.guia > 0) {
        const obj = objetivoGuia(esfera.position, f.dir);
        if (obj) {
          const deseada = obj.subtract(esfera.position).normalize().scale(v.length());
          v.copyFrom(BABYLON.Vector3.Lerp(v, deseada, Math.min(1, f.guia * dtF)));
        }
      }
      agg.body.setLinearVelocity(v);
    });

    agg.body.setCollisionCallbackEnabled(true);
    agg.body.getCollisionObservable().add(ev => {
      if (f.clavada) return;
      const otro = ev.collidedAgainst === agg.body ? ev.collider : ev.collidedAgainst;
      const punto = ev.point ? ev.point.clone() : esfera.position.clone();
      const c = duenio.get(otro);
      if (c) impactos.push({ f, c, cuerpo: otro, punto, vel: f.velPrevia.clone() });
      else if (otro.getMotionType && otro.getMotionType() === BABYLON.PhysicsMotionType.STATIC)
        impactos.push({ f, punto, pared: true });
    });

    f.timer = setTimeout(() => { if (!f.clavada) quitarFlecha(f); }, FLECHA.vuelo * 1000);
  }

  function disparar(potencia, px, py) {
    const rayo = scene.createPickingRay(px, py, BABYLON.Matrix.Identity(), camera);
    const dir = rayo.direction.normalize();
    const origen = rayo.origin.add(dir.scale(1.5));
    const mod = PODERES.modDisparo(potencia >= POT_MAX);
    const n = mod.flechas;
    S.disparo(potencia, n);
    for (let i = 0; i < n; i++) {
      const ang = (i - (n - 1) / 2) * FLECHA.abanico * GR;
      const q = BABYLON.Quaternion.RotationAxis(BABYLON.Axis.Y, ang);
      lanzarFlecha(origen, dir.applyRotationQuaternion(q), potencia, mod);
    }
  }

  scene.onBeforeRenderObservable.add(() => {
    while (impactos.length) {
      const im = impactos.shift();
      const f = im.f;
      if (f.clavada || !flechas.has(f)) continue;
      if (im.pared) {
        if (f.explosion) explotar(im.punto, f.explosion, "x" + f.id + "p");
        else if (performance.now() - ultimoSonidoPared > 60) { S.pared(); ultimoSonidoPared = performance.now(); }
        clavar(f, im.punto, null);
        continue;
      }
      if (!corredores.includes(im.c) || im.c.intangible || im.c.bolasVistas.has("g" + f.id)) continue;
      golpear(im.c, im.cuerpo, im.vel, f.id);
      if (f.explosion) explotar(im.punto, f.explosion, "x" + f.id + "_" + aplastados);
      if (f.perfora > 0 && f.agg) {
        f.perfora--;
        f.agg.body.setLinearVelocity(im.vel);
        continue;
      }
      clavar(f, im.punto, im.cuerpo.transformNode);
    }
  });

  // ---------- Controles (mouse y táctil) ----------
  const POT_MIN = 10, POT_MAX = 100, T_CARGA = 1.2;
  let cargando = false, tCarga = 0, dedo = null, modoCamara = false;
  const toques = new Set();
  const mira = document.getElementById("mira");
  const btnModo = document.getElementById("modo");

  // En táctil la mira va un "dedo" más arriba, para que el dedo no tape hacia dónde apuntas
  const OFFSET_DEDO = 70;   // px
  const puntoMira = e => {
    const r = canvas.getBoundingClientRect();
    const dy = e.pointerType === "mouse" ? 0 : OFFSET_DEDO;
    return { x: e.clientX - r.left, y: Math.max(0, e.clientY - r.top - dy) };
  };

  const potenciaActual = () => {
    const k = Math.min(1, tCarga / T_CARGA);
    return Math.round(POT_MIN + (POT_MAX - POT_MIN) * k * (2 - k));
  };
  const mostrarPotencia = v => {
    slider.value = v;
    const titan = v >= POT_MAX && PODERES.nivelTitan > 0;
    fv.textContent = titan ? v + " 👑" : v;
    const col = titan ? "#ffcc22" : colorPotencia(v).toHexString();
    fv.style.color = col;
    mira.style.borderColor = col;
    mira.style.boxShadow = titan ? "0 0 14px 4px #ffcc22" : "0 0 0 2px rgba(0,0,0,.4)";
    const s = 70 - 40 * (v - POT_MIN) / (POT_MAX - POT_MIN);
    mira.style.width = mira.style.height = s + "px";
  };
  const moverMira = e => {
    const p = puntoMira(e);
    mira.style.left = p.x + "px";
    mira.style.top = p.y + "px";
  };
  const cancelar = () => { cargando = false; dedo = null; mira.style.display = "none"; S.tensarFin(); };

  const setModoCamara = on => {
    modoCamara = on;
    camera.inputs.attached.pointers.buttons = on ? [0, 1, 2] : [1, 2];
    btnModo.textContent = on ? "🎯 Disparar" : "🎥 Cámara";
    btnModo.classList.toggle("activo", on);
    cancelar();
  };
  btnModo.addEventListener("pointerdown", e => e.stopPropagation());
  btnModo.addEventListener("click", () => setModoCamara(!modoCamara));
  if (esMovil) btnModo.style.display = "block";

  canvas.addEventListener("pointerdown", e => {
    if (e.pointerType === "touch") toques.add(e.pointerId);
    if (toques.size > 1) { cancelar(); return; }
    if (modoCamara || !jugando || e.button !== 0 || cargando) return;
    cargando = true; tCarga = 0; dedo = e.pointerId;
    mostrarPotencia(POT_MIN);
    S.tensarInicio();
    if (e.pointerType !== "mouse") { moverMira(e); mira.style.display = "block"; }
  });
  window.addEventListener("pointermove", e => { if (cargando && e.pointerId === dedo) moverMira(e); });
  window.addEventListener("pointerup", e => {
    toques.delete(e.pointerId);
    if (!cargando || e.pointerId !== dedo) return;
    const { x: px, y: py } = puntoMira(e);
    const pot = potenciaActual();
    cancelar();
    disparar(pot, px, py);
  });
  window.addEventListener("pointercancel", e => { toques.delete(e.pointerId); if (e.pointerId === dedo) cancelar(); });
  window.addEventListener("blur", cancelar);
  document.addEventListener("visibilitychange", () => { if (document.hidden) cancelar(); });

  scene.onBeforeRenderObservable.add(() => {
    if (!cargando) return;
    tCarga += Math.min(engine.getDeltaTime() / 1000, 0.05) * PODERES.factorCarga();
    mostrarPotencia(potenciaActual());
    S.tensar(Math.min(1, tCarga / T_CARGA));
  });

  hud();
})().catch(e => msg("Error: " + e.message));
</script>
<script src="gameover.js"></script>
